# Pilot brand/operator seed (spec §14, User Story 1 T038).
#
# These are real, publicly known GB-facing online casino brands and their
# operating companies — registering that a brand exists and who operates it
# is public master data, not a commercial claim requiring the evidence model
# (that applies to Observations: traffic, revenue, etc., captured later via
# ingestion). Fields left blank (domains, exact launch dates) are marked
# `last_verified_at: null` and should be confirmed during Phase 2 ingestion
# rather than trusted as pre-verified.
#
# Stratification (source doc §14): large listed operators, casino-only
# challengers, sportsbook-led casino brands, mobile-first brands, premium/VIP
# brands, bonus-led brands, entertainment-led brands, one crypto-native
# comparator clearly separated from GB-licensed brands, and a spread of
# expected traffic/sentiment tiers (to be measured, not assumed, via later
# Traffic/Reputation observations).

