    allowed_units: [index_0_100]
    evidence_types: [subjective_audit]

  # --- Derived metrics (formulas live in src/casino_intel/derivation/formulas.py) ---
  - metric_id: revenue_per_active_customer
    display_name: Revenue per active customer
    subject_types: [operator, brand]
    data_type: number
    allowed_units: [gbp]
    evidence_types: [derived]
    comparability_group: derived_revenue_per_customer
  - metric_id: ggy_per_average_monthly_active_account
    display_name: GGY per average monthly active account
    subject_types: [operator, brand]
    data_type: number
    allowed_units: [gbp]
    evidence_types: [derived]
    comparability_group: derived_ggy_per_account
    caveats: ["Not equivalent to per-customer lifetime value - numerator/denominator periods differ"]
  - metric_id: marketing_pct_revenue
    display_name: Marketing expense as % of revenue
    subject_types: [operator, brand]
    data_type: number
    allowed_units: [percent]
    evidence_types: [derived]
    comparability_group: derived_marketing_pct_revenue
  - metric_id: adjusted_ebitda_margin
    display_name: Adjusted EBITDA margin
    subject_types: [operator]
    data_type: number
    allowed_units: [percent]
    evidence_types: [derived]
    comparability_group: derived_ebitda_margin
  - metric_id: traffic_growth_yoy
    display_name: Traffic growth, year on year
    subject_types: [brand]
    data_type: number
    allowed_units: [percent]
    evidence_types: [derived]
    comparability_group: derived_traffic_growth
  - metric_id: indicative_cpa_range
    display_name: Indicative CPA range
    subject_types: [brand]
    data_type: number
    allowed_units: [gbp]
    evidence_types: [inferred_range]
    comparability_group: derived_cpa_range
    caveats: ["No single mandatory formula; assumptions must always be recorded"]
