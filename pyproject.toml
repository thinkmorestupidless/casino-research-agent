[project]
name = "casino-intel"
version = "0.1.0"
description = "Online Casino Competitive Intelligence Database: ingestion pipeline and CLI over a Google Sheets workbook"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "httpx>=0.27",
    "tenacity>=8.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-ulid>=2.2",
    "playwright>=1.42",
    "typer>=0.12",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "black>=24.4",
]

[project.scripts]
casino-intel = "casino_intel.cli.app:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]
